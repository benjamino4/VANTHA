<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>VANTHA · Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ ICON LIBRARY (inline, no emoji anywhere) ============ -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFE9A3"/><stop offset=".55" stop-color="#FFD700"/><stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="g-crimson" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FF6B7A"/><stop offset=".5" stop-color="#C41E3A"/><stop offset="1" stop-color="#5E0A18"/>
    </linearGradient>
    <linearGradient id="g-bone" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#8C8474"/>
    </linearGradient>

    <symbol id="i-sword" viewBox="0 0 24 24">
      <path d="M14.5 3.2 20.8 3.2 20.8 9.5 11.4 18.9 9.1 16.6 18.5 7.2Z" fill="url(#g-gold)"/>
      <path d="M9.4 15.4 6.6 18.2 4.2 15.8 7 13Z" fill="#FFD700" opacity=".55"/>
      <path d="M6.2 18.6 4 20.8" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M3.4 15.2 8.8 20.6" stroke="#B8860B" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
    </symbol>

    <symbol id="i-fang" viewBox="0 0 24 24">
      <path d="M5 3c4.2 5.2 6.2 9.9 6.2 14.4 0 1.6-.5 3-1.5 4.1-1-1.1-1.5-2.5-1.5-4.1C8.2 13 6.6 8.4 5 3Z" fill="url(#g-crimson)"/>
      <path d="M19 3c-4.2 5.2-6.2 9.9-6.2 14.4 0 1.6.5 3 1.5 4.1 1-1.1 1.5-2.5 1.5-4.1C15.8 13 17.4 8.4 19 3Z" fill="url(#g-crimson)" opacity=".85"/>
      <circle cx="12" cy="20.4" r="1.1" fill="#FF6B7A"/>
    </symbol>

    <symbol id="i-eye" viewBox="0 0 24 24">
      <path d="M2.2 12C5 7.4 8.4 5 12 5s7 2.4 9.8 7C19 16.6 15.6 19 12 19s-7-2.4-9.8-7Z" stroke="url(#g-gold)" stroke-width="1.4" fill="none"/>
      <circle cx="12" cy="12" r="3.1" fill="url(#g-gold)"/>
      <circle cx="12" cy="12" r="1.05" fill="#000"/>
      <path d="M12 2.2v1.9M12 19.9v1.9M4.4 4.4l1.3 1.3M18.3 18.3l1.3 1.3M19.6 4.4l-1.3 1.3M5.7 18.3l-1.3 1.3" stroke="#FFD700" stroke-width="1" stroke-linecap="round" opacity=".75"/>
    </symbol>

    <symbol id="i-crown" viewBox="0 0 24 24">
      <path d="M3 7.5 7.6 11 12 4l4.4 7L21 7.5 19.4 19H4.6L3 7.5Z" fill="url(#g-crimson)"/>
      <path d="M6 19h12" stroke="#FFD700" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="12" cy="13" r="1.3" fill="#FFD700"/>
    </symbol>

    <symbol id="i-coil" viewBox="0 0 24 24">
      <path d="M12 3c4 0 6.4 2.4 6.4 5.4 0 2.6-1.9 4.3-4.2 4.3-1.9 0-3.2-1.2-3.2-2.8 0-1.4 1-2.4 2.3-2.4" stroke="url(#g-gold)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M12 21c-4 0-6.4-2.4-6.4-5.4 0-2.6 1.9-4.3 4.2-4.3 1.9 0 3.2 1.2 3.2 2.8 0 1.4-1 2.4-2.3 2.4" stroke="#C41E3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="1.2" fill="#FFD700"/>
    </symbol>

    <symbol id="i-skull" viewBox="0 0 24 24">
      <path d="M12 2.6c4.7 0 8 3.1 8 7.6 0 2.8-1.3 4.6-3.2 5.6v2.4c0 .8-.6 1.4-1.4 1.4h-6.8c-.8 0-1.4-.6-1.4-1.4v-2.4C5.3 14.8 4 13 4 10.2c0-4.5 3.3-7.6 8-7.6Z" fill="url(#g-bone)" opacity=".92"/>
      <ellipse cx="9" cy="10.2" rx="1.7" ry="1.9" fill="#050505"/>
      <ellipse cx="15" cy="10.2" rx="1.7" ry="1.9" fill="#050505"/>
      <path d="M11 14.4h2l-.6 2h-.8Z" fill="#050505"/>
      <path d="M9.4 19.4v1.6M12 19.4v1.9M14.6 19.4v1.6" stroke="#0A0A0A" stroke-width="1.2" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-bolt" viewBox="0 0 24 24">
      <path d="M13.4 2 5 13.6h5.1L9.4 22 19 9.8h-5.3L13.4 2Z" fill="url(#g-gold)"/>
    </symbol>

    <symbol id="i-shield" viewBox="0 0 24 24">
      <path d="M12 2.6 20 5.4v6.2c0 4.6-3.2 8.2-8 9.8-4.8-1.6-8-5.2-8-9.8V5.4L12 2.6Z" stroke="#FFD700" stroke-width="1.3" fill="rgba(255,215,0,.08)"/>
      <path d="M8.6 11.8 11 14.4l4.6-5" stroke="#FFD700" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="i-skip" viewBox="0 0 24 24">
      <path d="M6 5.5 13 12l-7 6.5V5.5Z" fill="#2A1D00"/>
      <path d="M13.5 5.5 20.5 12l-7 6.5V5.5Z" fill="#2A1D00" opacity=".55"/>
    </symbol>

    <symbol id="i-hourglass" viewBox="0 0 24 24">
      <path d="M7 3h10M7 21h10" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M8 3c0 4 4 5.4 4 9s-4 5-4 9M16 3c0 4-4 5.4-4 9s4 5 4 9" stroke="#FFD700" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M10.2 16.6h3.6" stroke="#C41E3A" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div id="app">
  <div class="stage" id="stage">

    <!-- atmosphere -->
    <div class="orbs" aria-hidden="true">
      <span class="orb orb--gold"></span>
      <span class="orb orb--crimson"></span>
      <span class="orb orb--gold2"></span>
    </div>
    <div class="grain" aria-hidden="true"></div>

    <!-- ============ TOP RAIL ============ -->
    <header class="rail glass">
      <div class="rail__brand">VANTHA</div>
      <div class="rail__meta">
        <span class="rail__turn" id="turn-no">TURN I</span>
        <span class="rail__dot" aria-hidden="true"></span>
        <span class="rail__state" id="turn-state">YOUR MOVE</span>
      </div>
    </header>

    <!-- ============ ENEMY CARD ============ -->
    <section class="enemy glass" id="enemy-card" aria-label="Enemy">
      <div class="enemy__avatar" id="enemy-avatar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-skull"/></svg>
        <span class="enemy__ring" aria-hidden="true"></span>
      </div>

      <div class="enemy__body">
        <div class="enemy__head">
          <h1 class="enemy__name" id="enemy-name">The Hollow Knight</h1>
          <span class="enemy__lv" id="enemy-lv">LV 4</span>
        </div>

        <div class="hpbar hpbar--enemy" id="enemy-hpbar">
          <div class="hpbar__track">
            <div class="hpbar__ghost" id="enemy-hp-ghost"></div>
            <div class="hpbar__fill" id="enemy-hp-fill"></div>
            <div class="hpbar__ticks" aria-hidden="true"></div>
          </div>
          <div class="hpbar__num" id="enemy-hp-num">???</div>
        </div>

        <div class="estats" id="enemy-stats">
          <div class="estat" data-stat="power"><span class="estat__k">PWR</span><span class="estat__v">???</span></div>
          <div class="estat" data-stat="speed"><span class="estat__k">SPD</span><span class="estat__v">???</span></div>
          <div class="estat" data-stat="health"><span class="estat__k">VIT</span><span class="estat__v">???</span></div>
          <div class="estat" data-stat="presence"><span class="estat__k">PRS</span><span class="estat__v">???</span></div>
        </div>
      </div>

      <div class="float-layer" id="enemy-float" aria-live="polite"></div>
    </section>

    <!-- ============ CLASH ARENA ============ -->
    <section class="arena" id="arena" aria-label="Clash arena">
      <div class="arena__grid" aria-hidden="true"></div>
      <div class="arena__glow" aria-hidden="true"></div>

      <div class="arena__tag arena__tag--l"><span>YOU</span></div>
      <div class="arena__tag arena__tag--r"><span>FOE</span></div>

      <div class="arena__vs" aria-hidden="true">
        <span class="arena__vs-ring"></span>
        <span class="arena__vs-t">VS</span>
      </div>

      <div class="arena__fx" id="arena-fx" aria-hidden="true"></div>
      <div class="arena__flash" id="arena-flash" aria-hidden="true"></div>

      <div class="arena__hint" id="arena-hint">
        <span class="arena__hint-t">PLAY A CARD</span>
        <span class="arena__hint-s">3 AP PER TURN · 5 CARDS</span>
      </div>

      <div class="intent" id="intent" data-mode="idle">
        <svg class="intent__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bolt"/></svg>
        <span class="intent__t" id="intent-text">READING THE GLASS</span>
      </div>
    </section>

    <!-- ============ PLAYER PANEL ============ -->
    <section class="player glass" aria-label="Your stats">
      <div class="player__id">
        <span class="player__sigil" aria-hidden="true">
          <svg viewBox="0 0 24 24"><use href="#i-shield"/></svg>
        </span>
        <div class="player__names">
          <span class="player__name" id="player-name">The Unnamed</span>
          <span class="player__handle">ASHBOUND · LV 7</span>
        </div>
      </div>

      <div class="player__vitals">
        <div class="hpbar hpbar--player" id="player-hpbar">
          <div class="hpbar__track"><div class="hpbar__fill" id="player-hp-fill"></div></div>
          <div class="hpbar__num" id="player-hp-num">64 / 64</div>
        </div>

        <div class="pstats">
          <div class="pstat"><span class="pstat__k">POWER</span><b class="pstat__v" id="stat-power">7</b></div>
          <div class="pstat"><span class="pstat__k">SPEED</span><b class="pstat__v" id="stat-speed">5</b></div>
          <div class="pstat"><span class="pstat__k">HEALTH</span><b class="pstat__v" id="stat-health">32</b></div>
          <div class="pstat pstat--ap">
            <span class="pstat__k">AP</span>
            <span class="ap" id="ap-pips" aria-label="Action points">
              <i class="ap__pip" data-i="0"></i><i class="ap__pip" data-i="1"></i><i class="ap__pip" data-i="2"></i>
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ HAND ============ -->
    <div class="hand" id="hand" aria-label="Your hand"></div>

    <!-- ============ ACTIONS ============ -->
    <div class="actions">
      <button class="btn btn--ghost" id="basic-btn" type="button">
        <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sword"/></svg>
        <span class="btn__label">Basic Attack</span>
        <span class="btn__cost">1 AP</span>
      </button>

      <button class="btn btn--gold" id="end-btn" type="button">
        <span class="btn__label">End Turn</span>
        <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-skip"/></svg>
      </button>
    </div>

    <!-- ============ OVERLAY ============ -->
    <div class="verdict" id="verdict" aria-hidden="true">
      <div class="verdict__panel glass">
        <div class="verdict__sigil" id="verdict-sigil">
          <svg viewBox="0 0 24 24"><use href="#i-skull"/></svg>
        </div>
        <h2 class="verdict__title" id="verdict-title">THE HOLLOW KNIGHT FALLS</h2>
        <p class="verdict__sub" id="verdict-sub">The ground remembers what you did here.</p>
        <button class="btn btn--gold verdict__btn" id="verdict-btn" type="button">
          <span class="btn__label" id="verdict-btn-label">Claim the Ground</span>
        </button>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
